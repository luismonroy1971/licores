<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#4c5208"/><stop offset=".55" stop-color="#141606"/><stop offset="1" stop-color="#070805"/>
    </radialGradient>
    <linearGradient id="canY" x1="0" x2="1">
      <stop offset="0" stop-color="#b38a00"/><stop offset=".3" stop-color="#ffe25a"/><stop offset=".55" stop-color="#ffd21a"/><stop offset="1" stop-color="#8a6a00"/>
    </linearGradient>
    <linearGradient id="canR" x1="0" x2="1">
      <stop offset="0" stop-color="#7a0c22"/><stop offset=".3" stop-color="#ff4d6d"/><stop offset=".55" stop-color="#e0153c"/><stop offset="1" stop-color="#5a0818"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#7a7a7a"/><stop offset=".5" stop-color="#f2f2f2"/><stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="400" height="480" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".45">
    <circle cx="50" cy="80" r="14" fill="#d8ff3a"/><circle cx="350" cy="70" r="16" fill="#ffe25a"/><circle cx="370" cy="230" r="10" fill="#d8ff3a"/><circle cx="30" cy="250" r="14" fill="#ff4d6d"/>
  </g>
  <ellipse cx="200" cy="290" rx="150" ry="150" fill="#e8f53a" opacity=".22" filter="url(#glow)"/>
  <ellipse cx="200" cy="455" rx="160" ry="13" fill="#000" opacity=".7"/>
  <!-- red can (back) -->
  <g transform="translate(206,0)">
    <ellipse cx="45" cy="128" rx="45" ry="9" fill="url(#silver)"/>
    <path d="M0,130 H90 V430 Q90,444 76,444 H14 Q0,444 0,430 Z" fill="url(#canR)"/>
    <rect x="0" y="132" width="90" height="14" fill="url(#silver)"/>
    <rect x="0" y="420" width="90" height="10" fill="url(#silver)"/>
    <text x="45" y="210" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="15" fill="#fff" letter-spacing="1">HARD</text>
    <text x="45" y="234" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="16" fill="#fff">FRESA</text>
    <circle cx="45" cy="300" r="22" fill="#fff" fill-opacity=".15"/>
    <path d="M45,286 C60,286 62,300 56,312 C52,320 38,320 34,312 C28,300 30,286 45,286 Z" fill="#fff" opacity=".85"/>
    <rect x="10" y="150" width="10" height="268" rx="5" fill="url(#shine)" opacity=".5"/>
  </g>
  <!-- yellow can (front) -->
  <g transform="translate(110,30)">
    <ellipse cx="50" cy="118" rx="50" ry="10" fill="url(#silver)"/>
    <path d="M0,120 H100 V412 Q100,426 86,426 H14 Q0,426 0,412 Z" fill="url(#canY)"/>
    <rect x="0" y="122" width="100" height="14" fill="url(#silver)"/>
    <rect x="0" y="402" width="100" height="10" fill="url(#silver)"/>
    <text x="50" y="196" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="16" fill="#1a1a00" letter-spacing="1">HARD</text>
    <text x="50" y="222" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="17" fill="#1a1a00">LEMON</text>
    <circle cx="50" cy="296" r="30" fill="#fff59a"/><circle cx="50" cy="296" r="25" fill="#fffbd0"/>
    <g stroke="#ffd21a" stroke-width="2.5"><line x1="50" y1="272" x2="50" y2="320"/><line x1="26" y1="296" x2="74" y2="296"/><line x1="33" y1="279" x2="67" y2="313"/><line x1="67" y1="279" x2="33" y2="313"/></g>
    <text x="50" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#3a3000" letter-spacing="1.5">BEBIDA PREPARADA</text>
    <rect x="12" y="140" width="12" height="258" rx="6" fill="url(#shine)" opacity=".55"/>
    <g fill="#fff" opacity=".6"><ellipse cx="80" cy="170" rx="2" ry="3"/><ellipse cx="70" cy="250" rx="1.6" ry="2.6"/><ellipse cx="86" cy="330" rx="2" ry="3"/><ellipse cx="30" cy="380" rx="1.6" ry="2.4"/></g>
  </g>
  <!-- lemon slices -->
  <g transform="translate(66,420) rotate(-15)">
    <circle r="30" fill="#ffd21a"/><circle r="25" fill="#fff6a8"/>
    <g stroke="#ffd21a" stroke-width="2.5"><line x1="0" y1="-24" x2="0" y2="24"/><line x1="-24" y1="0" x2="24" y2="0"/><line x1="-17" y1="-17" x2="17" y2="17"/><line x1="17" y1="-17" x2="-17" y2="17"/></g>
  </g>
  <g transform="translate(345,428)"><circle r="22" fill="#9fd61a"/><circle r="18" fill="#e4f7a0"/>
    <g stroke="#9fd61a" stroke-width="2"><line x1="0" y1="-17" x2="0" y2="17"/><line x1="-17" y1="0" x2="17" y2="0"/></g></g>
</svg>
