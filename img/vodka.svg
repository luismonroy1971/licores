<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0e3a6e"/><stop offset=".55" stop-color="#07152a"/><stop offset="1" stop-color="#03060c"/>
    </radialGradient>
    <linearGradient id="frost" x1="0" x2="1">
      <stop offset="0" stop-color="#8fb8de" stop-opacity=".55"/><stop offset=".35" stop-color="#f2f8ff" stop-opacity=".85"/><stop offset=".6" stop-color="#bcd8f2" stop-opacity=".7"/><stop offset="1" stop-color="#6a93bd" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#6a7480"/><stop offset=".5" stop-color="#f4f7fa"/><stop offset="1" stop-color="#5c6670"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="400" height="480" fill="url(#bg)"/>
  <g filter="url(#blur)" fill="#5ab8ff" opacity=".5">
    <circle cx="50" cy="70" r="14"/><circle cx="350" cy="60" r="18"/><circle cx="370" cy="220" r="10"/><circle cx="26" cy="260" r="14"/><circle cx="310" cy="150" r="7"/>
  </g>
  <ellipse cx="200" cy="280" rx="130" ry="170" fill="#5ab8ff" opacity=".3" filter="url(#glow)"/>
  <ellipse cx="200" cy="455" rx="165" ry="14" fill="#000" opacity=".7"/>
  <!-- bottle -->
  <rect x="176" y="44" width="48" height="40" rx="4" fill="url(#silver)"/>
  <g stroke="#8a949e" stroke-width="1" opacity=".7"><line x1="176" y1="52" x2="224" y2="52"/><line x1="176" y1="60" x2="224" y2="60"/><line x1="176" y1="68" x2="224" y2="68"/></g>
  <path d="M180,84 H220 V150 C220,180 260,186 260,226 V436 Q260,452 244,452 H156 Q140,452 140,436 V226 C140,186 180,180 180,150 Z" fill="url(#frost)"/>
  <path d="M180,84 H220 V150 C220,180 260,186 260,226 V436 Q260,452 244,452 H156 Q140,452 140,436 V226 C140,186 180,180 180,150 Z" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <rect x="166" y="250" width="68" height="160" fill="#0b2a5a"/>
  <rect x="170" y="254" width="60" height="152" fill="none" stroke="url(#silver)" stroke-width="1.2"/>
  <text x="200" y="300" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#f4f7fa">V</text>
  <text x="200" y="326" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#f4f7fa">O</text>
  <text x="200" y="352" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#f4f7fa">D</text>
  <text x="200" y="378" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#f4f7fa">K</text>
  <text x="200" y="404" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#f4f7fa">A</text>
  <rect x="150" y="210" width="9" height="226" rx="4.5" fill="#fff" opacity=".55"/>
  <g fill="#fff" opacity=".75">
    <ellipse cx="246" cy="250" rx="2" ry="3"/><ellipse cx="240" cy="300" rx="1.6" ry="2.5"/><ellipse cx="250" cy="370" rx="2.2" ry="3.2"/><ellipse cx="155" cy="430" rx="1.6" ry="2.4"/><ellipse cx="205" cy="190" rx="1.6" ry="2.4"/>
  </g>
  <!-- ice -->
  <g fill="#dff0ff" fill-opacity=".35" stroke="#fff" stroke-opacity=".75" stroke-width="1.5">
    <path d="M60,440 L84,398 L120,410 L118,448 Z"/><path d="M280,448 L300,404 L340,400 L352,446 Z"/><path d="M110,452 L124,424 L150,430 L146,456 Z"/><path d="M330,452 L346,428 L372,436 L368,458 Z"/>
  </g>
  <!-- snowflake -->
  <g transform="translate(70,120)" stroke="#bfe3ff" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="0" y1="-24" x2="0" y2="24"/><line x1="-21" y1="-12" x2="21" y2="12"/><line x1="-21" y1="12" x2="21" y2="-12"/>
  </g>
  <g transform="translate(330,300)" stroke="#bfe3ff" stroke-width="2.4" stroke-linecap="round" opacity=".6">
    <line x1="0" y1="-16" x2="0" y2="16"/><line x1="-14" y1="-8" x2="14" y2="8"/><line x1="-14" y1="8" x2="14" y2="-8"/>
  </g>
</svg>
