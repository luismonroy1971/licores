<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <radialGradient id="bg" cx="45%" cy="40%" r="75%">
      <stop offset="0" stop-color="#5a3311"/><stop offset=".55" stop-color="#1b1009"/><stop offset="1" stop-color="#080605"/>
    </radialGradient>
    <linearGradient id="liq" x1="0" x2="1">
      <stop offset="0" stop-color="#4a1d04"/><stop offset=".35" stop-color="#c06a14"/><stop offset=".6" stop-color="#8a420a"/><stop offset="1" stop-color="#3a1603"/>
    </linearGradient>
    <linearGradient id="dram" x1="0" y1="0" x2="0" y2="1">
